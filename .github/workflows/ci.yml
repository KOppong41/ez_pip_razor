name: Safety CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-safety:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.sqlite3
      ALLOW_SQLITE_DESKTOP: "true"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-not-for-production
      BROKER_CREDS_KEY: 6jTJHhC0XqsIbvdcq9uC4GRxGWQN52RuWW4jrnTvH60=
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Run complete Django test suite
        run: python manage.py test --verbosity 2

  desktop-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
