# Development/support stack only. MetaTrader 5 is a Windows desktop API and
# live execution must use the host-launched single MT5 worker documented in
# LIVE_TRADING_RUNBOOK.md.
x-app-environment: &app-environment
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ez_piprazor_db
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_HOST: db
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  redis:
    image: redis:7
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  db:
    image: postgres:16
    container_name: trading_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ez_piprazor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trading_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_celery_worker
    command: celery -A config worker --loglevel=info --queues=celery
    env_file:
      - .env
    environment: *app-environment
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - trading_bot
    restart: unless-stopped

volumes:
  postgres_data:
